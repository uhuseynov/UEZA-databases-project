
[project]
name = "ueza-databases-project"
version = "0.1.0"
description = "Native vector search and RAG evaluation using MariaDB"
readme = "README.md"
authors = [
    { name = "Egehan Kılıçarslan", email = "ekilicarslan@constructor.university" },
]
requires-python = ">=3.14"
dependencies = [
    "aiomysql>=0.3.2",
    "alembic>=1.20.0",
    "dependency-injector>=4.49.1",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.3",
    "mwparserfromhell>=0.7.2",
    "pydantic-settings>=2.15.0",
    "pymysql>=1.2.3",
    "python-json-logger>=4.2.0",
    "sentence-transformers>=6.1.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "torch>=2.11.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

markers = [
    "integration: tests that require network access or external services",
]

addopts = ["-ra"]
