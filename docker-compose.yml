services:
  db:
    image: mariadb:12.3.3
    restart: unless-stopped
    # Vector index settings, measured in docs/database/Index-State.md and Vector-Search.md:
    # 64 MB index cache instead of 16 MB, so deleted vectors (which stay in the graph until
    # the next rebuild) do not push the graph out of the cache; mhnsw_ef_search 40 instead
    # of 20 for the nearest-first search.
    command: ["--mhnsw-max-cache-size=64M", "--mhnsw-ef-search=40"]

    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_password}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-ueza_db}
      MARIADB_USER: ${MARIADB_USER:-ueza}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-ueza_password}

    # Published on the loopback interface only: the host (make run, make ingest, the tests)
    # reaches it at 127.0.0.1, other machines on the network do not. The app container uses
    # the internal address db:3306. The password defaults below are for local development.
    ports:
      - "127.0.0.1:${MARIADB_PORT:-3306}:3306"

    volumes:
      - mariadb_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    # Every setting of src/config.py (LLM, embeddings, RAG, MediaWiki, ...) comes from .env.
    # The file is optional (CI has none; the defaults of src/config.py then apply). It is read
    # when the container starts and is neither copied into the image (.dockerignore) nor
    # baked into a layer. Values under `environment:` take precedence over it.
    env_file:
      - path: .env
        required: false

    environment:
      # Inside the Compose network the database is the `db` service, whatever .env says
      # (.env points MARIADB_HOST at 127.0.0.1 for the app that runs on the host).
      MARIADB_HOST: db
      MARIADB_PORT: 3306
      MARIADB_USER: ${MARIADB_USER:-ueza}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-ueza_password}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-ueza_db}

      # Both caches live in the article_cache volume (mounted at /app/.cache), so neither the
      # downloaded articles nor the ~440 MB embedding model are fetched again when the
      # container is recreated. HF_HOME is where sentence-transformers keeps its models.
      CACHE_DIR: /app/.cache/articles
      HF_HOME: /app/.cache/huggingface

    # Lets .env use http://host.docker.internal:11434/v1 for an Ollama running on the host
    # (built in on Docker Desktop and OrbStack, needed on Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "${APP_PORT:-8000}:8000"

    volumes:
      - article_cache:/app/.cache

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mariadb_data:
  article_cache:
