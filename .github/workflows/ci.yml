name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

jobs:
  # ===========================================================================
  # Lint (Ruff)
  # ===========================================================================

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Only the dev group: Ruff does not need torch or the other runtime dependencies.
      - name: Install Ruff
        run: uv sync --locked --only-group dev

      - name: Ruff lint
        run: uv run --no-sync ruff check --output-format=github .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check --diff .

      # Standard library only: links, anchors, paths, make targets and setting names.
      - name: Documentation check
        run: python3 scripts/check_docs.py

  # ===========================================================================
  # Unit Tests
  # ===========================================================================

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run unit tests
        run: uv run pytest tests/unit -ra

  # ===========================================================================
  # Integration Tests
  # ===========================================================================

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs:
      - unit-tests

    env:
      APP_ENV: development
      LOG_LEVEL: INFO

      MARIADB_HOST: 127.0.0.1
      MARIADB_PORT: 3306
      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_USER: ueza
      MARIADB_PASSWORD: ueza_password
      MARIADB_DATABASE: ueza_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Start MariaDB
        run: docker compose up -d db --wait

      - name: Show MariaDB status
        run: docker compose ps db

      # Some database tests skip themselves when MariaDB or the schema is missing. In CI that
      # would turn a broken database into a green run, so a skip fails this step.
      - name: Run integration tests
        run: |
          uv run pytest tests/integration -ra | tee integration.log
          if grep -q "^SKIPPED" integration.log; then
            echo "::error::Integration tests were skipped; the database or schema is not available."
            exit 1
          fi

      - name: Show MariaDB logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 db

      - name: Stop MariaDB
        if: always()
        run: docker compose down -v --remove-orphans

  # ===========================================================================
  # Docker Build & Smoke Test
  # ===========================================================================

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs:
      - integration-tests

    env:
      APP_ENV: development
      LOG_LEVEL: INFO

      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_USER: ueza
      MARIADB_PASSWORD: ueza_password
      MARIADB_DATABASE: ueza_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build application image
        run: docker compose build app

      - name: Start application stack
        run: docker compose up -d --no-build --wait

      - name: Show container status
        run: docker compose ps

      - name: Verify health endpoint
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --retry 5 \
            --retry-delay 2 \
            http://localhost:8000/health

      - name: Show application logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop application stack
        if: always()
        run: docker compose down -v --remove-orphans

  # ===========================================================================
  # Final CI Gate
  # ===========================================================================

  ci:
    name: CI Passed
    runs-on: ubuntu-latest
    timeout-minutes: 5

    needs:
      - lint
      - docker

    steps:
      - name: Verify pipeline
        run: |
          echo "Lint passed."
          echo "Unit tests passed."
          echo "Integration tests passed."
          echo "Docker build passed."
          echo "Application smoke test passed."
          echo "CI pipeline completed successfully."
